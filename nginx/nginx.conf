worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8080;

        # Preview routes for user apps — populated dynamically
        include /etc/nginx/conf.d/*.conf;

        # Fallback
        location / {
            return 404 "No preview found";
        }
    }
}
