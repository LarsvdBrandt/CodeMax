version: '3.9'

# ── Re-usable logging config ──────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:

  # ── nginx — sole external entrypoint ─────────────────────────────────────────
  # Routes /api/* → backend:3000 and /* → frontend:5173
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME:-app}_nginx
    ports:
      - '${NGINX_PORT:-3080}:80'
    depends_on:
      - backend
      - frontend
    networks:
      - app_net
    logging: *default-logging

  # ── Frontend (Vite dev server) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME:-app}_frontend
    environment:
      VITE_PORT: '5173'
      VITE_APP_NAME: '${APP_NAME:-My App}'
    networks:
      - app_net
    logging: *default-logging

  # ── Backend (Express API) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME:-app}_backend
    environment:
      PORT: '3000'
      MONGODB_URI: 'mongodb://mongo:27017/${MONGO_DB_NAME:-app}'
      JWT_SECRET: '${JWT_SECRET}'
      JWT_EXPIRES_IN: '7d'
      NODE_ENV: 'development'
    depends_on:
      - mongo
    networks:
      - app_net
    logging: *default-logging

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  # No credentials — project-isolated, development only
  mongo:
    image: mongo:7
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME:-app}_mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net
    logging: *default-logging

volumes:
  mongo_data:
    name: ${COMPOSE_PROJECT_NAME:-app}_mongo_data

networks:
  app_net:
    name: ${COMPOSE_PROJECT_NAME:-app}_net
    driver: bridge
