services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: codemax
      POSTGRES_PASSWORD: codemax
      POSTGRES_DB: codemax
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemax"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    platform: linux/arm64
    environment:
      RABBITMQ_DEFAULT_USER: codemax
      RABBITMQ_DEFAULT_PASS: codemax
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codemax:codemax@postgres:5432/codemax
      RABBITMQ_URL: amqp://codemax:codemax@rabbitmq:5672/
      PROJECTS_DIR: /projects
      TEMPLATES_DIR: /templates
    volumes:
      - ./backend:/app
      - codemax_projects:/projects
      - ./templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sh start.sh

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codemax:codemax@postgres:5432/codemax
      RABBITMQ_URL: amqp://codemax:codemax@rabbitmq:5672/
      PROJECTS_DIR: /projects
      TEMPLATES_DIR: /templates
    volumes:
      - ./backend:/app
      - codemax_projects:/projects
      - ./templates:/templates
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python worker.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    platform: linux/arm64
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  codemax_projects:
    name: codemax_projects

networks:
  default:
    name: codemax_network
    driver: bridge
