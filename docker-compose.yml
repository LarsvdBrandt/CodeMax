services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: codemax
      POSTGRES_PASSWORD: codemax
      POSTGRES_DB: codemax
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemax"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    platform: linux/arm64
    environment:
      RABBITMQ_DEFAULT_USER: codemax
      RABBITMQ_DEFAULT_PASS: codemax
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    platform: linux/arm64
    environment:
      MONGO_INITDB_ROOT_USERNAME: codemax
      MONGO_INITDB_ROOT_PASSWORD: codemax
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codemax
      SPRING_DATASOURCE_USERNAME: codemax
      SPRING_DATASOURCE_PASSWORD: codemax
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: codemax
      SPRING_RABBITMQ_PASSWORD: codemax
      PROJECTS_DIR: /projects
      TEMPLATES_DIR: /templates
      MONGO_ROOT_URL: mongodb://codemax:codemax@mongodb:27017
    volumes:
      - codemax_projects:/projects
      - ./templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # worker: Java worker — not yet implemented. Uncomment when ready.
  # worker:
  #   build:
  #     context: ./backend-java
  #     dockerfile: Dockerfile
  #   platform: linux/arm64
  #   env_file: .env
  #   environment:
  #     SPRING_PROFILES_ACTIVE: worker
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codemax
  #     SPRING_DATASOURCE_USERNAME: codemax
  #     SPRING_DATASOURCE_PASSWORD: codemax
  #     SPRING_RABBITMQ_HOST: rabbitmq
  #     SPRING_RABBITMQ_PORT: 5672
  #     SPRING_RABBITMQ_USERNAME: codemax
  #     SPRING_RABBITMQ_PASSWORD: codemax
  #     PROJECTS_DIR: /projects
  #     TEMPLATES_DIR: /templates
  #   volumes:
  #     - codemax_projects:/projects
  #     - ./templates:/templates
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql://codemax:codemax@postgres:5432/codemax
      BETTER_AUTH_URL: http://localhost:3000
      # Override in .env to use your verified Resend domain.
      # Default falls back to onboarding@resend.dev (Resend test address).
      # RESEND_FROM_EMAIL: CodeMax <noreply@yourdomain.com>
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    platform: linux/arm64
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  codemax_projects:
    name: codemax_projects

networks:
  default:
    name: codemax_network
    driver: bridge
